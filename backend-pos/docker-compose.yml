version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-pos
    restart: always
    environment:
      POSTGRES_DB: sistema-pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: juanaraujo21
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: